[project]
name = "FanBot"
version = "0.1.0"
description = "FanBot"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[aiohttp,fastapi,httpx,websockets]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-parser>=2.6.5",
    "nonebot-plugin-llmchat>=0.5.1",
    "nonebot_plugin_memes>=0.8.1",
    "pillow<12,>=11",
    "sqlmodel>=0.0.38",
    "nb-cli>=1.7.4",
    "nonebot-plugin-maimaidx>=3.1.3",
    "nonebot-adapter-milky>=1.3.0",
]

[tool.nonebot]
plugin_dirs = ["src/plugins"]
builtin_plugins = []

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
"@local" = []
nonebot-adapter-milky = [{name = "nonebot-adapter-milky", module_name = "nonebot.adapters.milky"}]

[tool.nonebot.plugins]
"@local" = []
nonebot-plugin-apscheduler = ["nonebot_plugin_apscheduler"]
nonebot-plugin-parser = ["nonebot_plugin_parser"]
nonebot-plugin-maimaidx = ["nonebot_plugin_maimaidx"]
nonebot-plugin-llmchat = ["nonebot_plugin_llmchat"]
nonebot_plugin_memes = ["nonebot_plugin_memes"]
