# main 的 CI 通过后，把同一个 commit 部署到服务器。
#
# 环境 "bot config" 需要 SSH_HOST、SSH_USER、SSH_PRIVATE_KEY，
# 可选 SSH_PORT（默认 22）。SSH_USER 需要免密 sudo。
# APP_DIR、SCREEN_NAME、LOG_FILE 在 job 的 env 中按服务器实际情况修改。

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署，排队而不是打断正在进行的那个
concurrency:
  group: deploy-fanbot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 部署到服务器
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    environment: "bot config"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      APP_DIR: /home/lighthouse/nonebot/FanBot
      SCREEN_NAME: fanbot
      LOG_FILE: /tmp/fanbot.log

    steps:
      - name: 部署 CI 验证过的 commit
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          : "${SSH_HOST:?环境 bot config 缺少 SSH_HOST}"
          : "${SSH_USER:?环境 bot config 缺少 SSH_USER}"
          : "${SSH_PRIVATE_KEY:?环境 bot config 缺少 SSH_PRIVATE_KEY}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          trap 'rm -f ~/.ssh/id_deploy' EXIT

          ssh-keyscan -T 10 -p "${SSH_PORT:-22}" -H "$SSH_HOST" \
            >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

          echo "部署 $DEPLOY_SHA"
          remote_env="$(printf 'DEPLOY_SHA=%q APP_DIR=%q SCREEN_NAME=%q LOG_FILE=%q' \
            "$DEPLOY_SHA" "$APP_DIR" "$SCREEN_NAME" "$LOG_FILE")"

          ssh -i ~/.ssh/id_deploy \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=10 \
              -o ServerAliveInterval=30 \
              -p "${SSH_PORT:-22}" \
              "${SSH_USER}@${SSH_HOST}" \
              "export $remote_env; bash -s" <<'REMOTE'
          set -euo pipefail

          APP_DIR="${APP_DIR:-/home/lighthouse/nonebot/FanBot}"
          SCREEN_NAME="${SCREEN_NAME:-fanbot}"
          LOG_FILE="${LOG_FILE:-/tmp/fanbot.log}"
          VENV_PY="$APP_DIR/.venv/bin/python"

          if [ "$(id -u)" -eq 0 ]; then
            sudo_cmd=()
          elif sudo -n true 2>/dev/null; then
            sudo_cmd=(sudo -n)
          else
            echo "SSH_USER 需要 root 或免密 sudo" >&2
            exit 1
          fi
          run() { "${sudo_cmd[@]}" "$@"; }
          screen_active() {
            run screen -ls 2>/dev/null \
              | grep -Eq "\.${SCREEN_NAME}[[:space:]]+.*\((Attached|Detached)\)"
          }

          # 项目目录可能是 root 属主，先声明给 git 的 safe.directory。
          run git config --global --get-all safe.directory | grep -qxF "$APP_DIR" \
            || run git config --global --add safe.directory "$APP_DIR"

          if ! run test -x "$VENV_PY"; then
            echo "找不到 $VENV_PY，请先按 README 创建 .venv" >&2
            exit 1
          fi

          old_sha="$(run git -C "$APP_DIR" rev-parse HEAD)"
          run git -C "$APP_DIR" fetch --no-tags origin "$DEPLOY_SHA"
          run git -C "$APP_DIR" merge --ff-only "$DEPLOY_SHA"
          new_sha="$(run git -C "$APP_DIR" rev-parse HEAD)"
          if [ "$new_sha" != "$DEPLOY_SHA" ]; then
            echo "服务器 HEAD 是 $new_sha，不是 CI 验证的 $DEPLOY_SHA" >&2
            exit 1
          fi
          echo "代码：$old_sha -> $new_sha"

          if ! run git -C "$APP_DIR" diff --quiet "$old_sha" "$new_sha" \
            -- requirements.txt pyproject.toml; then
            echo "依赖清单有变化，安装 requirements.txt"
            run "$VENV_PY" -m pip install -r "$APP_DIR/requirements.txt"
          fi

          if ! run bash -c 'command -v screen >/dev/null 2>&1'; then
            echo "服务器没有安装 screen" >&2
            exit 1
          fi

          echo "重启 screen 会话 $SCREEN_NAME"
          run screen -S "$SCREEN_NAME" -X quit >/dev/null 2>&1 || true
          for _ in {1..20}; do
            screen_active || break
            sleep 0.5
          done
          if screen_active; then
            echo "旧 screen 会话没有退出，请先手动处理 $SCREEN_NAME" >&2
            exit 1
          fi
          run screen -wipe >/dev/null 2>&1 || true
          run bash -c ": > '$LOG_FILE'" || true
          run screen -L -Logfile "$LOG_FILE" -dmS "$SCREEN_NAME" \
            bash -c "cd '$APP_DIR' && exec '$VENV_PY' main.py"

          sleep 5
          if ! screen_active; then
            echo "main.py 没有保持运行，请在服务器执行 screen -r $SCREEN_NAME 或查看 $LOG_FILE" >&2
            exit 1
          fi
          echo "部署完成：$new_sha"
          REMOTE
